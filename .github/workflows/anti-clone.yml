name: Anti-clone

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
    branches: [ main, 'arena/**' ]

jobs:
  anti-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run H7 anti-clone test
        run: node tests/anti-clone.mjs
