name: Static analysis

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
      - 'arena/**'

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: php -l
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find theme plugin tools tests -type f -name '*.php' -not -path '*/vendor/*' -print0)

  phpcs:
    name: PHPCS WordPress (Core + Docs + PHPCompatibilityWP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: tools/php/vendor
          key: php-tools-${{ runner.os }}-${{ hashFiles('tools/php/composer.lock', 'tools/php/composer.json') }}
          restore-keys: |
            php-tools-${{ runner.os }}-

      - name: Install PHP quality tools
        working-directory: tools/php
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCS — WordPress Core + Docs + PHPCompatibilityWP
        run: |
          set -euo pipefail
          tools/php/vendor/bin/phpcs --standard=phpcs.xml.dist --report=full --colors

      - name: PHPCS — WooCommerce-Core on plugin
        run: |
          set -euo pipefail
          tools/php/vendor/bin/phpcs --standard=plugin/arena-engine/phpcs-woo.xml --report=full --colors

  phpstan:
    name: PHPStan level 6 + WPCompat (requiresAtLeast 6.9)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: tools/php/vendor
          key: php-tools-${{ runner.os }}-${{ hashFiles('tools/php/composer.lock', 'tools/php/composer.json') }}
          restore-keys: |
            php-tools-${{ runner.os }}-

      - name: Install PHP quality tools
        working-directory: tools/php
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPStan
        run: |
          set -euo pipefail
          tools/php/vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --memory-limit=1G

  eslint:
    name: ESLint (WordPress + WooCommerce)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:js

  abilities:
    name: Abilities API contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Run abilities contract check
        run: php tests/php/abilities-contract-check.php
