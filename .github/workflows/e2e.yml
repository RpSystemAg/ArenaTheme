name: End-to-end

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
      - 'arena/**'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php:
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Matrix PHP version into wp-env config
        run: |
          node -e "\
            const fs = require('fs'); \
            const file = '.wp-env.json'; \
            const config = JSON.parse(fs.readFileSync(file, 'utf8')); \
            config.phpVersion = process.argv[1]; \
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n'); \
          " "${{ matrix.php }}"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        run: npx wp-env start

      - name: Run Playwright
        run: npx playwright test --reporter=line

      - name: Upload Playwright trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.php }}
          path: test-results/
          if-no-files-found: ignore

      - name: Stop wp-env
        if: always()
        run: npx wp-env stop
