name: php

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # G-W4 · PHPCS WordPress-VIP-Go + WooCommerce-Core + WordPress-Extra:
  # 0 errors, 0 warnings over the whole shipped tree.
  phpcs:
    name: PHPCS GW4 (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.5' ]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, zip, mysqli
          coverage: none
          tools: composer:v2

      - name: Install standards
        working-directory: tools/php
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCS — WordPress-VIP-Go
        run: |
          set -o pipefail
          tools/php/vendor/bin/phpcs --standard=phpcs-gw4.xml.dist \
            --report=full --report-checkstyle=tests/proofs/phpcs-checkstyle.xml \
            2>&1 | tee tests/proofs/ci-phpcs.log

      - name: PHPStan level 6
        run: |
          set -o pipefail
          tools/php/vendor/bin/phpstan analyse -c phpstan.neon.dist --no-progress \
            2>&1 | tee tests/proofs/ci-phpstan.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpcs-proofs-${{ matrix.php }}
          path: tests/proofs
          if-no-files-found: warn

  # G-W4 · Official Plugin Check (static + runtime) and Theme Check, run
  # against a real WordPress 7.1 install backed by MySQL.
  extension-check:
    name: Plugin Check + Theme Check (WP 7.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: [ '3306:3306' ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, zip, mysqli, gd
          coverage: none
          tools: composer:v2, wp-cli

      - name: Install WordPress 7.1
        working-directory: /tmp
        run: |
          mkdir -p wp && cd wp
          wp core download --version=7.1 --allow-root
          wp config create --dbname=wordpress --dbuser=root --dbpass=root \
            --dbhost=127.0.0.1 --allow-root
          wp core install --url=http://localhost:8888 --title="Arena CI" \
            --admin_user=admin --admin_password=password \
            --admin_email=ci@arena.test --allow-root

      - name: Install the checkers from source (the .org zip of plugin-check ships no CLI)
        working-directory: /tmp/wp/wp-content/plugins
        run: |
          git clone --depth 1 --branch trunk https://github.com/WordPress/plugin-check.git plugin-check
          cd plugin-check && composer install --no-interaction --no-progress
          cd ..
          curl -sL https://github.com/WordPress/theme-check/archive/refs/heads/master.zip -o theme-check.zip
          unzip -q theme-check.zip && mv theme-check-master theme-check && rm theme-check.zip

      - name: Copy the stack in and activate
        working-directory: /tmp/wp
        run: |
          cp -r "$GITHUB_WORKSPACE/plugin/arena-engine" wp-content/plugins/arena-engine
          cp -r "$GITHUB_WORKSPACE/theme/arena-commerce" wp-content/themes/arena-commerce
          wp plugin activate plugin-check theme-check woocommerce --all=false --allow-root || true
          wp plugin install woocommerce --activate --allow-root
          wp theme activate arena-commerce --allow-root
          wp plugin list --allow-root | tee "$GITHUB_WORKSPACE/tests/proofs/ci-wp-extensions.log"

      - name: Plugin Check — arena-engine (static + runtime)
        working-directory: /tmp/wp
        run: |
          set -o pipefail
          wp plugin check arena-engine \
            --require=/tmp/wp/wp-content/plugins/plugin-check/cli.php \
            --format=table --allow-root 2>&1 \
            | tee "$GITHUB_WORKSPACE/tests/proofs/ci-plugin-check.log"

      - name: Theme Check — arena-commerce
        working-directory: /tmp/wp
        run: |
          set -o pipefail
          wp theme check arena-commerce --allow-root 2>&1 \
            | tee "$GITHUB_WORKSPACE/tests/proofs/ci-theme-check.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-check-proofs
          path: tests/proofs
          if-no-files-found: warn
